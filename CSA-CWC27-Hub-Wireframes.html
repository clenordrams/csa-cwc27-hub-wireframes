<script>
(function () {
  const DATA = JSON.parse(document.getElementById('screens').textContent);
  const app = document.getElementById('app');
  const picker = document.getElementById('picker');
  const styleEl = document.getElementById('screen-style');
  const parsed = {}, classes = {};
  let instances = {}, mountQueue = [], current = null, pending = false;

  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = undefined; }
    setState(p) {
      const prev = this.state || {};
      const next = typeof p === 'function' ? p(prev, this.props) : p;
      this.state = Object.assign({}, prev, next);
      schedule();
    }
    forceUpdate() { schedule(); }
  }
  function schedule() { if (pending) return; pending = true; setTimeout(() => { pending = false; render(); }, 0); }

  function tpl(name) {
    if (!parsed[name]) { const t = document.createElement('template'); t.innerHTML = DATA[name].template; parsed[name] = t.content; }
    return parsed[name];
  }
  function cls(name) {
    if (!classes[name]) classes[name] = new Function('DCLogic', DATA[name].logic + '\nreturn Component;')(DCLogic);
    return classes[name];
  }
  function lookup(expr, scopes) {
    const e = expr.trim();
    if (e === 'true') return true; if (e === 'false') return false; if (e === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(e)) return Number(e);
    if (/^'.*'$|^".*"$/.test(e)) return e.slice(1, -1);
    const parts = e.split('.');
    let v;
    for (let i = scopes.length - 1; i >= 0; i--) { if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) { v = scopes[i][parts[0]]; break; } }
    for (let i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function interp(str, scopes) {
    const whole = str.match(/^\s*\{\{([^}]*)\}\}\s*$/);
    if (whole) return lookup(whole[1], scopes);
    return str.replace(/\{\{([^}]*)\}\}/g, (_, x) => { const v = lookup(x, scopes); return v == null ? '' : String(v); });
  }
  function bind(el, handlers) {
    el.__h = handlers; el.__d = el.__d || {};
    Object.keys(handlers).forEach((type) => {
      if (el.__d[type]) return; el.__d[type] = true;
      el.addEventListener(type, (e) => { const f = el.__h && el.__h[type]; if (typeof f === 'function') { e.preventDefault(); f(e); } });
    });
  }
  function renderComponent(name, props, key) {
    let inst = instances[key];
    const merged = Object.assign({}, DATA[name].defaults, props);
    if (!inst) { const C = cls(name); inst = new C(merged); instances[key] = inst; mountQueue.push(inst); }
    inst.props = merged;
    const vals = inst.renderVals ? inst.renderVals() || {} : {};
    return renderChildren(tpl(name), [vals], key);
  }
  function renderChildren(parent, scopes, key) {
    const out = [];
    parent.childNodes.forEach((n) => { const r = renderNode(n, scopes, key); if (Array.isArray(r)) out.push(...r); else if (r) out.push(r); });
    return out;
  }
  function renderNode(n, scopes, key) {
    if (n.nodeType === 3) return document.createTextNode(n.data.indexOf('{{') >= 0 ? String(interp(n.data, scopes) ?? '') : n.data);
    if (n.nodeType !== 1) return null;
    const tag = n.localName;
    if (tag === 'sc-for') {
      const list = interp(n.getAttribute('list') || '', scopes) || [];
      const as = n.getAttribute('as') || 'item';
      const out = [];
      list.forEach((item, i) => { out.push(...renderChildren(n, scopes.concat([{ [as]: item, $index: i }]), key + '.' + i)); });
      return out;
    }
    if (tag === 'sc-if') return interp(n.getAttribute('value') || '', scopes) ? renderChildren(n, scopes, key) : [];
    if (tag === 'dc-import') {
      const props = {};
      Array.from(n.attributes).forEach((a) => {
        if (a.name === 'name' || a.name.startsWith('hint-')) return;
        props[a.name.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = interp(a.value, scopes);
      });
      const name = n.getAttribute('name');
      return renderComponent(name, props, key + '>' + name);
    }
    const el = document.createElementNS(n.namespaceURI, n.localName);
    const handlers = {};
    Array.from(n.attributes).forEach((a) => {
      if (a.name.startsWith('hint-')) return;
      if (/^on[a-z]+$/.test(a.name) && a.value.indexOf('{{') >= 0) { handlers[a.name.slice(2)] = interp(a.value, scopes); return; }
      let v = a.value.indexOf('{{') >= 0 ? interp(a.value, scopes) : a.value;
      v = v == null ? '' : String(v);
      if (a.name === 'href' && /\.dc\.html$/.test(v)) v = '#' + v.replace(/^\//, '').replace(/\.dc\.html$/, '');
      el.setAttribute(a.name, v);
    });
    bind(el, handlers);
    renderChildren(n, scopes, key).forEach((c) => el.appendChild(c));
    return el;
  }
  function same(a, b) { return a.nodeType === b.nodeType && (a.nodeType === 3 || (a.nodeName === b.nodeName && a.namespaceURI === b.namespaceURI)); }
  function patchNode(o, n) {
    if (o.nodeType === 3) { if (o.data !== n.data) o.data = n.data; return; }
    Array.from(o.attributes).forEach((a) => { if (!n.hasAttribute(a.name)) o.removeAttribute(a.name); });
    Array.from(n.attributes).forEach((a) => { if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value); });
    bind(o, n.__h || {});
    patchChildren(o, Array.from(n.childNodes));
  }
  function patchChildren(parent, kids) {
    const old = Array.from(parent.childNodes);
    kids.forEach((k, i) => {
      if (i >= old.length) parent.appendChild(k);
      else if (same(old[i], k)) patchNode(old[i], k);
      else parent.replaceChild(k, old[i]);
    });
    for (let i = kids.length; i < old.length; i++) parent.removeChild(old[i]);
  }
  function screenFromHash() { const h = decodeURIComponent(location.hash.slice(1)); return DATA[h] && h !== 'HubHeader' ? h : 'Main'; }
  function render() {
    const screen = screenFromHash();
    if (screen !== current) {
      Object.values(instances).forEach((i) => { if (i.componentWillUnmount) i.componentWillUnmount(); });
      instances = {}; mountQueue = []; app.innerHTML = ''; current = screen;
      styleEl.textContent = DATA[screen].style; picker.value = screen; window.scrollTo(0, 0);
    }
    patchChildren(app, renderComponent(screen, {}, 'root'));
    const q = mountQueue; mountQueue = [];
    q.forEach((i) => { if (i.componentDidMount) i.componentDidMount(); });
  }
  function fit() {
    const z = Math.min(1, (window.innerHeight - 32) / 868, (window.innerWidth - 32) / 414);
    document.documentElement.style.setProperty('--z', String(Math.max(0.3, z)));
  }
  window.addEventListener('resize', fit);
  fit();
  picker.addEventListener('change', () => { location.hash = picker.value; });
  window.addEventListener('hashchange', render);
  render();
})();
