n    const current = nationList.find((n) => n.id === sel);\n    const vids = ['Breaking down the new Cricket World Cup format', 'Brian Lara shares memories of CWC 2003', 'CWC27 venues and brand unveiled'];\n    const road = st.road || '';\n    const hosts = ['South Africa', 'Zimbabwe'];\n    const ranked = ['Afghanistan', 'Australia', 'Bangladesh', 'England', 'India', 'New Zealand', 'Pakistan', 'Sri Lanka'];\n    const groupsBy = {\n      q: [{ title: 'HOSTS', teams: hosts }, { title: 'ODI RANKINGS (30 SEP 2026)', teams: ranked }],\n      s: [\n        { title: 'CWC QUALIFIER \u00b7 FEB 2027 \u00b7 TOP 4 GO TO THE WORLD CUP', teams: ['Ireland', 'West Indies', 'USA', 'Scotland', 'Netherlands', 'Oman', '+ 4 from Play-off'] },\n        { title: 'QUALIFIER PLAY-OFF \u00b7 NEPAL \u00b7 4\u201321 DEC 2026 \u00b7 TOP 4 ADVANCE', teams: ['Namibia', 'Nepal', 'UAE', 'Canada', 'Jersey', 'Kuwait', 'Italy', 'Uganda'] },\n      ],\n      t: [{ title: 'CONFIRMED (10)', teams: hosts.concat(ranked) }, { title: 'STILL TO QUALIFY (4)', teams: ['TBA', 'TBA', 'TBA', 'TBA'] }],\n    };\n    return {\n      roadTiles: [['q', '10', 'QUALIFIED'], ['s', '4', 'SPOTS LEFT'], ['t', '14', 'TEAMS']].map(([id, value, label]) => ({ value, label, on: road === id, off: road !== id, pick: () => this.setState({ road: road === id ? '' : id }) })),\n      roadOpen: !!road,\n      roadGroups: groupsBy[road] || [],\n      cd: { d: String(d), h: p(h), m: p(m), s: p(s) },\n      ballot: !!st.ballot,\n      openBallot: () => this.setState({ ballot: true }),\n      closeBallot: () => this.setState({ ballot: false }),\n      share: () => this.flash('Native share sheet opens (hub deep link)'),\n      hasToast: !!st.toast,\n      toast: st.toast || '',\n      nations: nationList.map((n) => ({ name: n.name, count: n.venues.length + (n.venues.length === 1 ? ' venue' : ' venues'), on: n.id === sel, off: n.id !== sel, pick: () => this.setState({ nation: n.id }) })),\n      nationName: current.name,\n      venues: current.venues,\n      videos: vids.map((t) => ({ title: t, play: () => this.setState({ playing: t }) })),\n      playing: !!st.playing,\n      playingTitle: st.playing || '',\n      stop: () => this.setState({ playing: '' }),\n    };\n  }\n}", "defaults": {}}, "HubMatches": {"template": "<div style=\"min-height: 100vh; box-sizing: border-box; padding: 40px; display: flex; align-items: center; justify-content: center; background: #DBE0E4\"><div style=\"width: 414px; height: 868px; box-sizing: border-box; padding: 12px; background: #121113; border-radius: 56px; flex-shrink: 0\"><div style=\"width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative; background: #F4F4F9\"><div style=\"height: 47px; background: #3E0005; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 36px; position: relative; flex-shrink: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Montserrat, sans-serif\"><span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.2px\">9:41<\/span><div aria-hidden=\"true\" style=\"position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; background: #000000; border-radius: 18px\"><\/div><div aria-hidden=\"true\" style=\"display: flex; align-items: center; gap: 6px\"><svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"#FFFFFF\"><rect x=\"0\" y=\"8\" width=\"3\" height=\"4\" rx=\"1\"><\/rect><rect x=\"5\" y=\"5.5\" width=\"3\" height=\"6.5\" rx=\"1\"><\/rect><rect x=\"10\" y=\"3\" width=\"3\" height=\"9\" rx=\"1\"><\/rect><rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"><\/rect><\/svg><svg width=\"16\" height=\"12\" viewBox=\"0 0 16 12\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M1 4.2a10 10 0 0114 0\"><\/path><path d=\"M3.6 6.9a6.2 6.2 0 018.8 0\"><\/path><path d=\"M6.3 9.5a2.4 2.4 0 013.4 0\"><\/path><\/svg><svg width=\"27\" height=\"13\" viewBox=\"0 0 27 13\" fill       if (i >= old.length) parent.appendChild(k);
      else if (same(old[i], k)) patchNode(old[i], k);
      else parent.replaceChild(k, old[i]);
    });
    for (let i = kids.length; i < old.length; i++) parent.removeChild(old[i]);
  }
  function screenFromHash() { const h = decodeURIComponent(location.hash.slice(1)); return DATA[h] && h !== 'HubHeader' ? h : 'Main'; }
  function render() {
    const screen = screenFromHash();
    if (screen !== current) {
      Object.values(instances).forEach((i) => { if (i.componentWillUnmount) i.componentWillUnmount(); });
      instances = {}; mountQueue = []; app.innerHTML = ''; current = screen;
      styleEl.textContent = DATA[screen].style; picker.value = screen; window.scrollTo(0, 0);
    }
    patchChildren(app, renderComponent(screen, {}, 'root'));
    const q = mountQueue; mountQueue = [];
    q.forEach((i) => { if (i.componentDidMount) i.componentDidMount(); });
  }
  picker.addEventListener('change', () => { location.hash = picker.value; });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
